url: https://umc-utrecht-rwe.github.io/syntheaModuleR/

template:
  bootstrap: 5

navbar:
  structure:
    left:  [getstarted, reference, articles, news]
    right: [search, github]
  components:
    getstarted:
      text: Get started
      href: articles/overview.html
    articles:
      text: Articles
      menu:
      - text: The Frontend layer
        href: articles/frontend-layer.html
      - text: Building cohorts incrementally
        href: articles/cohort-building.html
      - text: From a codelist to a module
        href: articles/bridge-to-module.html
      - text: -------
      - text: Advanced
      - text: The Engine layer
        href: articles/layers.html
      - text: Recipe vs. hand-composed
        href: articles/recipe-vs-compose.html
      - text: Logic combinators and guards
        href: articles/logic-and-guards.html
      - text: The Distribution component
        href: articles/distribution.html
      - text: SetAttribute value precedence
        href: articles/set-attribute-precedence.html
      - text: -------
      - text: GMF grammar reference
      - text: State reference
        href: articles/state-reference.html
      - text: Logic reference
        href: articles/logic-reference.html
      - text: Transition reference
        href: articles/transition-reference.html
      - text: Component reference
        href: articles/component-reference.html
      - text: -------
      - text: More articles...
        href: articles/index.html
    github:
      icon: fa-github
      href: https://github.com/UMC-Utrecht-RWE/syntheaModuleR
      aria-label: GitHub

articles:
- title: Getting started
  contents:
  - overview
  - frontend-layer
  - cohort-building
  - bridge-to-module

- title: Advanced
  desc: >
    The Engine (backend) layer: one builder per GMF grammar layer, mirroring
    Synthea's Java classes 1:1.
  contents:
  - layers
  - recipe-vs-compose
  - logic-and-guards
  - distribution
  - set-attribute-precedence

- title: GMF grammar reference
  desc: Generated per-type reference tables for every State, Logic, Transition and Component.
  contents:
  - state-reference
  - logic-reference
  - transition-reference
  - component-reference

reference:
- title: "Frontend: building blocks"
  desc: >
    Leaf constructors. Each returns a fragment (`list(states, entry, exit)`)
    wrapping one common clinical shape.
  contents:
  - create_condition
  - create_medication
  - create_discontinue
  - create_observation
  - create_vital_sign
  - create_procedure
  - create_encounter
  - create_allergy
  - create_careplan
  - create_vaccine
  - create_death
  - create_tag
  - create_counter
  - create_delay
  - create_guard
  - create_population
  - create_step

- title: "Frontend: combinators"
  desc: Compose fragments into larger fragments -- sequencing, branching and looping.
  contents:
  - chain
  - add
  - pathways
  - classify
  - repeat_until

- title: "Frontend: finishing a module"
  contents:
  - build_cohort_module

- title: "Codelist to module pipeline"
  desc: >
    Read a RWE-BRIDGE-style codelist, combine it with study parameters into a
    YAML spec, and assemble the spec into a module.
  contents:
  - read_bridge_codelist
  - bridge_columns
  - build_module_spec
  - write_module_spec
  - read_module_spec
  - build_module_from_spec

- title: "Backend (Engine layer): builders"
  desc: >
    One schema-driven builder per GMF grammar layer. Used by every Frontend
    function under the hood.
  contents:
  - create_component_settings
  - create_logic_settings
  - create_transition_settings
  - create_state_settings

- title: "Backend (Engine layer): modules"
  desc: Assemble, validate and write a module from hand-built states.
  contents:
  - build_module
  - validate_module
  - write_module_json
  - build_disease_module

- title: internal
  contents:
  - starts_with(".")
  - syntheaModuleR-package
